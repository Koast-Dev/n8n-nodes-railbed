# Lint, build and test on every pull request and every push to main.
#
# This file is inert inside the Railbed monorepo (GitHub only runs workflows at a repository's root). It runs in the
# public package repository that integrations/n8n is published from; see docs/n8n.md in the Railbed repository.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test
